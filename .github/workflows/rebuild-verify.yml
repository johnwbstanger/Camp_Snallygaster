name: Rebuild MVP Verify

on:
  push:
    branches: [rebuild/mvp-stable-baseline]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Verify production entry exists
        run: test -f dist/client/index.html && grep -q "assets/" dist/client/index.html
      - name: Verify create, join, roster, start, and movement sync
        run: npm run smoke:multiplayer
